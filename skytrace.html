<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>SKYTRACE</title>
<!-- Three.js for 3D Globe -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=JetBrains+Mono:wght@400;700&display=swap');

  :root {
    --bg: #070b14;
    --panel: rgba(18, 26, 43, 0.65);
    --panel-hover: rgba(25, 36, 58, 0.8);
    --border: rgba(255, 255, 255, 0.08);
    --border-highlight: rgba(0, 242, 254, 0.3);
    --primary: #00f2fe;
    --primary-gradient: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
    --danger: #ff0844;
    --warning: #f6d365;
    --text: #f0f4f8;
    --muted: #8b9eb0;
    --radius: 16px;
    --sans: 'Inter', system-ui, -apple-system, sans-serif;
    --mono: 'JetBrains Mono', monospace;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  
  html, body {
    height: 100vh; width: 100vw; overflow: hidden;
    background-color: var(--bg); color: var(--text);
    font-family: var(--sans); -webkit-font-smoothing: antialiased;
  }

  /* Animated Aurora Background */
  .aurora-bg { position: fixed; inset: 0; z-index: -2; overflow: hidden; background: var(--bg); }
  .aurora-blob { position: absolute; border-radius: 50%; filter: blur(100px); opacity: 0.4; animation: float 20s infinite ease-in-out alternate; }
  .blob-1 { width: 600px; height: 600px; background: #003b5c; top: -10%; left: -10%; }
  .blob-2 { width: 500px; height: 500px; background: #2c003e; bottom: -10%; right: -10%; animation-delay: -5s; }
  .blob-3 { width: 400px; height: 400px; background: #004d40; top: 40%; left: 40%; animation-delay: -10s; }
  @keyframes float { 0% { transform: translate(0, 0) scale(1); } 100% { transform: translate(100px, 50px) scale(1.2); } }

  .app { display: flex; flex-direction: column; height: 100vh; width: 100vw; position: relative; z-index: 1; }

  /* Header */
  header {
    flex-shrink: 0; height: 70px;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 32px; border-bottom: 1px solid var(--border);
    background: rgba(7, 11, 20, 0.4); backdrop-filter: blur(12px);
  }
  .brand { font-weight: 800; font-size: 1.2rem; letter-spacing: 1px; display: flex; align-items: center; gap: 10px; }
  .brand-icon { width: 24px; height: 24px; border-radius: 6px; background: var(--primary-gradient); box-shadow: 0 0 15px rgba(0, 242, 254, 0.5); }

  .top-nav { display: flex; gap: 8px; }
  .nav-btn {
    background: transparent; border: none; color: var(--muted);
    padding: 8px 16px; border-radius: 8px; font-family: var(--sans); font-weight: 600; font-size: 0.9rem;
    cursor: pointer; transition: all 0.3s ease;
  }
  .nav-btn:hover { color: var(--text); background: rgba(255,255,255,0.05); }
  .nav-btn.active { color: var(--bg); background: var(--primary-gradient); box-shadow: 0 0 20px rgba(0, 242, 254, 0.3); }

  .header-actions { display: flex; gap: 12px; }
  .icon-btn {
    background: rgba(255,255,255,0.03); border: 1px solid var(--border); color: var(--text);
    width: 36px; height: 36px; border-radius: 10px; display: flex; align-items: center; justify-content: center;
    cursor: pointer; transition: all 0.3s;
  }
  .icon-btn:hover { border-color: var(--primary); color: var(--primary); background: rgba(0, 242, 254, 0.1); }

  /* Main Content */
  .main-content { flex: 1; position: relative; padding: 24px 32px; overflow: hidden; }
  .page {
    position: absolute; inset: 24px 32px;
    opacity: 0; pointer-events: none; transition: opacity 0.3s ease, transform 0.3s ease;
    transform: translateY(10px); display: flex; flex-direction: column;
  }
  .page.active { opacity: 1; pointer-events: auto; transform: translateY(0); }

  /* Glass Panels */
  .glass-panel {
    background: var(--panel); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    border: 1px solid var(--border); border-radius: var(--radius);
    box-shadow: 0 10px 30px rgba(0,0,0,0.2); padding: 24px;
    transition: border-color 0.3s;
  }
  .glass-panel:hover { border-color: var(--border-highlight); }

  /* Dashboard */
  .bento-grid { display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: auto 1fr; gap: 20px; height: 100%; }
  .aqi-card { grid-column: 1 / -1; display: flex; align-items: center; justify-content: space-between; }
  .aqi-value { font-size: 4rem; font-weight: 800; line-height: 1; background: var(--primary-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  .aqi-details { display: flex; gap: 40px; }
  .aqi-stat { display: flex; flex-direction: column; gap: 4px; }
  .aqi-stat span { font-size: 0.8rem; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; font-weight: 600; }
  .aqi-stat strong { font-size: 1.2rem; font-family: var(--mono); }

  .wind-card { display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 16px; }
  .compass { width: 100px; height: 100px; border: 2px solid var(--border); border-radius: 50%; position: relative; display: flex; align-items: center; justify-content: center; }
  .compass::before { content: "N"; position: absolute; top: -10px; font-size: 0.7rem; color: var(--muted); }
  .compass-needle { width: 4px; height: 40px; background: var(--primary); border-radius: 4px; transform-origin: bottom center; transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1); }
  
  .threats-card { overflow-y: auto; }
  .threat-list { display: flex; flex-direction: column; gap: 12px; margin-top: 16px; }
  .threat-item { display: flex; justify-content: space-between; align-items: center; padding: 16px; background: rgba(0,0,0,0.2); border: 1px solid var(--border); border-radius: 12px; transition: background 0.2s; }
  .threat-item:hover { background: rgba(255,255,255,0.05); }
  .threat-item.urgent { border-left: 4px solid var(--danger); }
  .threat-name { font-weight: 600; font-size: 0.95rem; margin-bottom: 4px; }
  .threat-meta { font-size: 0.75rem; color: var(--muted); font-family: var(--mono); }
  .risk-badge { font-family: var(--mono); font-weight: 800; padding: 4px 10px; border-radius: 6px; font-size: 0.9rem; }
  .risk-high { background: rgba(255, 8, 68, 0.15); color: var(--danger); }
  .risk-med { background: rgba(246, 211, 101, 0.15); color: var(--warning); }

  /* Locations Page */
  .search-container { margin-bottom: 24px; display: flex; justify-content: center; }
  .search-wrapper {
    position: relative; width: 100%; max-width: 650px;
    display: flex; align-items: center; background: var(--panel); backdrop-filter: blur(20px);
    border: 1px solid var(--border); border-radius: 50px; padding: 4px 4px 4px 16px;
    transition: all 0.3s; box-shadow: 0 10px 30px rgba(0,0,0,0.2);
  }
  .search-wrapper:focus-within { border-color: var(--primary); box-shadow: 0 0 0 4px rgba(0, 242, 254, 0.1); }
  .search-icon { color: var(--muted); font-size: 1.2rem; margin-right: 12px; }
  .search-wrapper input {
    flex: 1; background: transparent; border: none; color: var(--text);
    font-family: var(--sans); font-size: 1rem; outline: none;
  }
  
  .btn-my-loc {
    background: transparent; border: 1px solid var(--border); color: var(--text);
    width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
    cursor: pointer; margin-right: 8px; transition: all 0.2s; font-size: 1.1rem;
  }
  .btn-my-loc:hover { border-color: var(--primary); background: rgba(0,242,254,0.1); color: var(--primary); }

  .btn-scan {
    background: var(--primary-gradient); color: var(--bg); border: none;
    padding: 12px 24px; border-radius: 50px; font-weight: 800; font-family: var(--sans);
    cursor: pointer; transition: transform 0.2s;
  }
  .btn-scan:hover { transform: scale(1.05); }

  .results-list { 
    display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); 
    gap: 12px; margin-bottom: 20px; max-height: 350px; overflow-y: auto; padding-right: 10px;
  }
  .result-item { 
    padding: 12px 16px; background: var(--panel); border: 1px solid var(--border); 
    border-radius: 12px; cursor: pointer; transition: all 0.2s; 
    display: flex; flex-direction: column; justify-content: center;
  }
  .result-item:hover { background: var(--panel-hover); border-color: var(--primary); transform: translateY(-2px); }
  .result-item strong { font-size: 0.95rem; color: var(--primary); margin-bottom: 4px; }
  .result-item span { font-size: 0.75rem; color: var(--muted); line-height: 1.3; }

  .watches-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; overflow-y: auto; flex: 1; padding-bottom: 20px; }
  .watch-card { position: relative; }
  .btn-remove { position: absolute; top: 16px; right: 16px; background: rgba(255,8,68,0.1); color: var(--danger); border: 1px solid rgba(255,8,68,0.3); padding: 4px 10px; border-radius: 8px; font-size: 0.7rem; cursor: pointer; transition: 0.2s; }
  .btn-remove:hover { background: var(--danger); color: #fff; }
  .map-frame { width: 100%; height: 160px; border-radius: 12px; border: 1px solid var(--border); margin: 16px 0; pointer-events: none; }
  .map-frame iframe { width: 100%; height: 100%; border: none; filter: invert(90%) hue-rotate(180deg) brightness(90%) contrast(120%); }
  
  /* 3D Globe Page */
  #page-world {
    padding: 0; inset: 24px 32px; overflow: hidden;
  }
  #globeContainer {
    width: 100%; height: 100%;
    background: #000; /* Pure black space */
    border-radius: var(--radius); border: 1px solid var(--border);
    position: relative; cursor: grab;
  }
  #globeContainer:active { cursor: grabbing; }

  /* Country Search Box (Overlay) */
  .country-search-overlay {
    position: absolute; top: 20px; left: 20px; width: 300px; z-index: 10;
  }
  .country-search-overlay input {
    width: 100%; padding: 14px 16px; background: var(--panel); backdrop-filter: blur(10px);
    border: 1px solid var(--border); border-radius: 8px; color: var(--text);
    font-family: var(--sans); font-size: 1rem; outline: none;
    box-shadow: 0 4px 15px rgba(0,0,0,0.5);
  }
  .country-search-overlay input:focus { border-color: var(--primary); }
  
  .dropdown-results {
    position: absolute; top: calc(100% + 8px); left: 0; right: 0;
    background: var(--panel); backdrop-filter: blur(20px);
    border: 1px solid var(--border); border-radius: 8px;
    max-height: 300px; overflow-y: auto; display: none;
    box-shadow: 0 10px 30px rgba(0,0,0,0.8);
  }
  .dropdown-results.active { display: block; }
  .dropdown-item {
    padding: 10px 16px; cursor: pointer; border-bottom: 1px solid rgba(255,255,255,0.05);
    font-family: var(--sans); font-size: 0.9rem;
  }
  .dropdown-item:hover { background: rgba(255,255,255,0.1); color: var(--primary); }

  /* Radar Page */
  .radar-container { 
    flex: 1; display: flex; align-items: center; justify-content: center; 
    position: relative; overflow: hidden; border-radius: var(--radius); 
    background: #040810; border: 1px solid var(--border);
    background-image: linear-gradient(rgba(0, 242, 254, 0.05) 1px, transparent 1px), linear-gradient(90deg, rgba(0, 242, 254, 0.05) 1px, transparent 1px);
    background-size: 40px 40px; box-shadow: inset 0 0 100px rgba(0,0,0,0.8);
  }
  .radar-sweep { position: absolute; width: 200vmax; height: 200vmax; border-radius: 50%; background: conic-gradient(from 0deg, transparent 0deg, transparent 270deg, rgba(0, 242, 254, 0.15) 360deg); animation: spin 4s linear infinite; }
  .radar-ring { position: absolute; border: 1px solid rgba(0, 242, 254, 0.2); border-radius: 50%; pointer-events: none; }
  .r1 { width: 150px; height: 150px; } .r2 { width: 300px; height: 300px; } .r3 { width: 450px; height: 450px; } .r4 { width: 600px; height: 600px; }
  .radar-cross-h { position: absolute; width: 100%; height: 1px; background: rgba(0, 242, 254, 0.15); pointer-events: none; }
  .radar-cross-v { position: absolute; height: 100%; width: 1px; background: rgba(0, 242, 254, 0.15); pointer-events: none; }
  .radar-center { width: 12px; height: 12px; background: #fff; border-radius: 50%; box-shadow: 0 0 20px 5px var(--primary); z-index: 10; }
  .radar-node { position: absolute; width: 8px; height: 8px; border-radius: 50%; background: var(--danger); box-shadow: 0 0 10px var(--danger); z-index: 5; transition: all 0.2s; }
  .radar-node::before, .radar-node::after { content: ""; position: absolute; border: 1px solid var(--danger); border-radius: 50%; width: 24px; height: 24px; top: -8px; left: -8px; opacity: 0.6; animation: ping 2s infinite ease-out; }
  .radar-node::after { animation-delay: 1s; }
  .radar-node:hover { transform: scale(1.5); background: #fff; box-shadow: 0 0 20px var(--danger); }
  .radar-node .label { position: absolute; top: -30px; left: 50%; transform: translateX(-50%); font-family: var(--mono); font-size: 0.7rem; color: var(--danger); background: rgba(0,0,0,0.8); padding: 4px 8px; border-radius: 4px; border: 1px solid var(--danger); white-space: nowrap; opacity: 0; pointer-events: none; transition: 0.2s; }
  .radar-node:hover .label { opacity: 1; }
  .hud-text { position: absolute; font-family: var(--mono); font-size: 0.8rem; color: var(--primary); text-shadow: 0 0 5px var(--primary); pointer-events: none; z-index: 20; }
  .hud-tl { top: 20px; left: 20px; } .hud-tr { top: 20px; right: 20px; text-align: right; } .hud-bl { bottom: 20px; left: 20px; } .hud-br { bottom: 20px; right: 20px; text-align: right; }
  @keyframes spin { 100% { transform: rotate(360deg); } }
  @keyframes ping { 0% { transform: scale(1); opacity: 0.8; } 100% { transform: scale(2.5); opacity: 0; } }

  /* History Page */
  .history-list { display: flex; flex-direction: column; gap: 10px; overflow-y: auto; flex: 1; }
  .history-item { display: flex; justify-content: space-between; padding: 16px 20px; background: var(--panel); border: 1px solid var(--border); border-radius: 12px; font-size: 0.9rem; }
  .history-time { color: var(--muted); font-family: var(--mono); }

  /* Toast */
  .toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(20px); background: var(--text); color: var(--bg); font-weight: 600; padding: 12px 24px; border-radius: 30px; z-index: 9999; opacity: 0; transition: all 0.3s; pointer-events: none; box-shadow: 0 10px 30px rgba(0,0,0,0.3); }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  @media (max-width: 900px) {
    .results-list { grid-template-columns: 1fr; }
    .bento-grid { grid-template-columns: 1fr; overflow-y: auto; }
    .top-nav { display: flex; overflow-x: auto; padding-bottom: 5px; }
    .nav-btn { white-space: nowrap; }
  }
</style>
</head>
<body>

<div class="aurora-bg">
  <div class="aurora-blob blob-1"></div>
  <div class="aurora-blob blob-2"></div>
  <div class="aurora-blob blob-3"></div>
</div>

<div class="app">
  <header>
    <div class="brand">
      <div class="brand-icon"></div>
      SKYTRACE
    </div>
    <div class="top-nav">
      <button class="nav-btn active" data-target="dashboard">Dashboard</button>
      <button class="nav-btn" data-target="locations">Locations</button>
      <button class="nav-btn" data-target="world">3D Globe</button>
      <button class="nav-btn" data-target="radar">Live Radar</button>
      <button class="nav-btn" data-target="history">History</button>
    </div>
    <div class="header-actions">
      <button class="icon-btn" id="btn-fullscreen" title="Fullscreen">⛶</button>
    </div>
  </header>

  <div class="main-content">
    
    <!-- DASHBOARD -->
    <div class="page active" id="page-dashboard">
      <div class="bento-grid">
        <div class="glass-panel aqi-card">
          <div>
            <div class="aqi-stat"><span>Current US AQI</span></div>
            <div class="aqi-value" id="aqiValue">--</div>
            <div style="color: var(--muted); margin-top: 8px; font-weight: 600;" id="aqiStatus">Loading Data...</div>
          </div>
          <div class="aqi-details">
            <div class="aqi-stat"><span>PM2.5</span><strong id="aqiPm25">--</strong></div>
            <div class="aqi-stat"><span>Ozone</span><strong id="aqiOzone">--</strong></div>
          </div>
        </div>
        <div class="glass-panel wind-card">
          <h3 style="color: var(--muted); font-size: 0.9rem; text-transform: uppercase;">Wind Direction</h3>
          <div class="compass"><div class="compass-needle" id="windNeedle"></div></div>
          <div style="font-family: var(--mono); font-weight: bold; font-size: 1.1rem;"><span id="windSpeed">--</span> km/h</div>
        </div>
        <div class="glass-panel threats-card">
          <h3 style="margin-bottom: 4px;">Top Nearby Threats</h3>
          <p style="color: var(--muted); font-size: 0.8rem;">Based on your primary location</p>
          <div class="threat-list" id="dashboardThreats">
            <p style="color: var(--muted); font-size: 0.9rem;">No locations added yet.</p>
          </div>
        </div>
      </div>
    </div>

    <!-- LOCATIONS -->
    <div class="page" id="page-locations">
      <div class="search-container">
        <div class="search-wrapper">
          <span class="search-icon">🔍</span>
          <input type="text" id="addressInput" placeholder="Search a city, state, or address..." autocomplete="off" />
          <button class="btn-my-loc" id="btnMyLocation" title="Use My Current Location">📍</button>
          <button class="btn-scan" id="btnScan">Scan</button>
        </div>
      </div>
      <div class="results-list" id="searchResults"></div>
      <div class="watches-grid" id="watchesGrid"></div>
    </div>

    <!-- 3D GLOBE -->
    <div class="page" id="page-world">
      <div id="globeContainer">
        <!-- Search Overlay -->
        <div class="country-search-overlay">
          <input type="text" id="countrySearch" placeholder="Search country..." autocomplete="off">
          <div id="countryDropdown" class="dropdown-results"></div>
        </div>
      </div>
    </div>

    <!-- RADAR -->
    <div class="page" id="page-radar">
      <div class="radar-container" id="radarContainer">
        <div class="radar-ring r1"></div><div class="radar-ring r2"></div>
        <div class="radar-ring r3"></div><div class="radar-ring r4"></div>
        <div class="radar-cross-h"></div><div class="radar-cross-v"></div>
        <div class="radar-sweep"></div><div class="radar-center"></div>
        
        <div class="hud-text hud-tl">SYS.STATUS: ONLINE<br>TARGETS: <span id="hudTargets">0</span></div>
        <div class="hud-text hud-tr">WIND: <span id="hudWind">--</span> km/h<br>AQI: <span id="hudAqi">--</span></div>
        <div class="hud-text hud-bl">LAT: <span id="hudLat">--</span><br>LON: <span id="hudLon">--</span></div>
        <div class="hud-text hud-br">SECTOR: ALPHA<br>SWEEP: ACTIVE</div>
      </div>
    </div>

    <!-- HISTORY -->
    <div class="page" id="page-history">
      <div class="history-list" id="historyList"></div>
    </div>

  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(() => {
  "use strict";

  const LS_DATA = "skytrace_glass_v11";
  const LS_HISTORY = "skytrace_glass_history_v11";
  let state = { watches: [], history: [] };
  
  // Three.js Variables
  let scene, camera, renderer, controls, earth;
  let globeInitialized = false;
  let allCountries = [];
  let isAnimatingCamera = false;

  function loadData() {
    try {
      const w = JSON.parse(localStorage.getItem(LS_DATA)); if (w) state.watches = w;
      const h = JSON.parse(localStorage.getItem(LS_HISTORY)); if (h) state.history = h;
    } catch (e) {}
  }
  function saveData() {
    localStorage.setItem(LS_DATA, JSON.stringify(state.watches));
    localStorage.setItem(LS_HISTORY, JSON.stringify(state.history));
    renderAll();
  }
  function addHistory(action) {
    state.history.unshift({ time: new Date().toISOString(), action });
    if (state.history.length > 50) state.history.pop();
    saveData();
  }

  const $ = s => document.querySelector(s);
  const esc = str => String(str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const uid = () => Math.random().toString(36).substr(2, 9);
  const fmtDate = iso => new Date(iso).toLocaleString();
  function toast(msg) {
    const el = $("#toast"); el.textContent = msg; el.classList.add("show");
    setTimeout(() => el.classList.remove("show"), 2500);
  }

  // --- 3D GLOBE (THREE.JS) ---
  function initGlobe() {
    if (globeInitialized) return;
    globeInitialized = true;

    const container = document.getElementById('globeContainer');
    
    scene = new THREE.Scene();
    camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
    camera.position.set(0, 0, 15); 

    renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(container.clientWidth, container.clientHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    container.appendChild(renderer.domElement);

    // 1. The Earth
    const earthGeometry = new THREE.SphereGeometry(5, 64, 64);
    const textureLoader = new THREE.TextureLoader();
    const earthTexture = textureLoader.load('https://unpkg.com/three-globe/example/img/earth-blue-marble.jpg');
    const earthMaterial = new THREE.MeshPhongMaterial({
        map: earthTexture,
        bumpScale: 0.05,
        specular: new THREE.Color(0x111111), 
        shininess: 5
    });
    earth = new THREE.Mesh(earthGeometry, earthMaterial);
    scene.add(earth);

    // 2. Fixed Sun and Light
    const sunLight = new THREE.DirectionalLight(0xffffff, 1.0); // Soft directional light
    sunLight.position.set(20, 15, 20);
    scene.add(sunLight);
    
    // Ambient Light to see the dark side clearly without glare
    const ambientLight = new THREE.AmbientLight(0x6b8cae, 2.5); 
    scene.add(ambientLight);

    // Visual Sun (Fixed Position)
    const sunGeometry = new THREE.SphereGeometry(2.0, 32, 32);
    const sunMaterial = new THREE.MeshBasicMaterial({ color: 0xffcc00 });
    const sun = new THREE.Mesh(sunGeometry, sunMaterial);
    sun.position.set(20, 15, 20); // Keep it far away
    scene.add(sun);

    // Soft Sun Glow (Reduced intensity)
    const spriteMap = new THREE.CanvasTexture(generateSprite());
    const spriteMaterial = new THREE.SpriteMaterial({ 
        map: spriteMap, 
        color: 0xffaa00, 
        transparent: true, 
        opacity: 0.4, // Reduced opacity for a softer look
        blending: THREE.AdditiveBlending 
    });
    const sunGlow = new THREE.Sprite(spriteMaterial);
    sunGlow.scale.set(10, 10, 1); // Smaller glow
    sunGlow.position.copy(sun.position);
    scene.add(sunGlow);

    // 3. Twinkling Stars
    const starsGeometry = new THREE.BufferGeometry();
    const starsCount = 3000;
    const posArray = new Float32Array(starsCount * 3);
    for(let i = 0; i < starsCount * 3; i++) {
        posArray[i] = (Math.random() - 0.5) * 200;
    }
    starsGeometry.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
    const starsMaterial = new THREE.PointsMaterial({ color: 0xffffff, size: 0.3, transparent: true, opacity: 0.8 });
    const stars = new THREE.Points(starsGeometry, starsMaterial);
    scene.add(stars);

    // 4. Controls & Auto-Rotation
    controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.enablePan = false;
    controls.minDistance = 7;
    controls.maxDistance = 30;
    
    controls.autoRotate = true;
    controls.autoRotateSpeed = 0.5; 

    // Animation Loop
    let time = 0;
    function animate() {
        requestAnimationFrame(animate);
        time += 0.05;

        // Twinkle stars
        starsMaterial.opacity = 0.5 + Math.sin(time) * 0.3;

        controls.update();
        renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
        camera.aspect = container.clientWidth / container.clientHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(container.clientWidth, container.clientHeight);
    });

    // Fetch Countries
    fetch('https://cdn.jsdelivr.net/npm/world-countries@4.0.0/countries.json')
      .then(res => res.json())
      .then(data => {
        data.sort((a, b) => a.name.common.localeCompare(b.name.common));
        allCountries = data.filter(c => c.latlng && c.latlng.length === 2);
      });

    setupCountrySearch();
  }

  function generateSprite() {
      const canvas = document.createElement('canvas');
      canvas.width = 16; canvas.height = 16;
      const context = canvas.getContext('2d');
      const gradient = context.createRadialGradient(8, 8, 0, 8, 8, 8);
      gradient.addColorStop(0, 'rgba(255,255,255,1)');
      gradient.addColorStop(0.2, 'rgba(255,255,0,1)');
      gradient.addColorStop(1, 'rgba(255,255,0,0)');
      context.fillStyle = gradient;
      context.fillRect(0, 0, 16, 16);
      return canvas;
  }

  // --- COUNTRY SEARCH ---
  function setupCountrySearch() {
    const searchInput = $("#countrySearch");
    const dropdown = $("#countryDropdown");

    searchInput.addEventListener("input", (e) => {
      const val = e.target.value.toLowerCase();
      if (val.length === 0) {
        dropdown.innerHTML = "";
        dropdown.classList.remove("active");
        return;
      }

      const matches = allCountries.filter(c => c.name.common.toLowerCase().includes(val)).slice(0, 20);
      
      if (matches.length === 0) {
        dropdown.innerHTML = '<div class="dropdown-item" style="color:var(--muted)">No results</div>';
        dropdown.classList.add("active");
        return;
      }

      dropdown.innerHTML = matches.map(c => `<div class="dropdown-item" data-lat="${c.latlng[0]}" data-lon="${c.latlng[1]}">${c.name.common}</div>`).join('');
      dropdown.classList.add("active");

      document.querySelectorAll('.dropdown-item').forEach(item => {
        item.addEventListener('click', () => {
          const lat = parseFloat(item.dataset.lat);
          const lon = parseFloat(item.dataset.lon);
          flyToLocation(lat, lon);
          searchInput.value = item.textContent;
          dropdown.classList.remove("active");
        });
      });
    });

    document.addEventListener("click", (e) => {
      if (!searchInput.contains(e.target) && !dropdown.contains(e.target)) {
        dropdown.classList.remove("active");
      }
    });
  }

  function getCameraPosForLatLon(lat, lon, radius) {
    const phi = (90 - lat) * (Math.PI / 180);
    const theta = (lon + 180) * (Math.PI / 180);
    
    const x = -(radius * Math.sin(phi) * Math.cos(theta));
    const z = (radius * Math.sin(phi) * Math.sin(theta));
    const y = (radius * Math.cos(phi));
    
    return new THREE.Vector3(x, y, z);
  }

  function flyToLocation(lat, lon) {
    isAnimatingCamera = true;
    controls.autoRotate = false; 
    
    const distance = 12; 
    const targetPos = getCameraPosForLatLon(lat, lon, distance);
    const startPos = camera.position.clone();

    let frame = 0;
    const totalFrames = 60; 

    function animateCamera() {
      if (frame >= totalFrames) {
        isAnimatingCamera = false;
        setTimeout(() => { controls.autoRotate = true; }, 5000);
        return;
      }
      frame++;
      
      const t = frame / totalFrames;
      const easedT = t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;

      camera.position.lerpVectors(startPos, targetPos, easedT);
      controls.update();
      
      if (frame < totalFrames) {
        requestAnimationFrame(animateCamera);
      }
    }
    animateCamera();
  }

  // --- UI NAVIGATION ---
  document.querySelectorAll(".nav-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      document.querySelectorAll(".nav-btn").forEach(b => b.classList.remove("active"));
      document.querySelectorAll(".page").forEach(p => p.classList.remove("active"));
      btn.classList.add("active");
      $(`#page-${btn.dataset.target}`).classList.add("active");
      
      if (btn.dataset.target === "radar") renderRadar();
      if (btn.dataset.target === "world") {
        setTimeout(() => { initGlobe(); }, 100);
      }
    });
  });

  // --- FULLSCREEN ---
  $("#btn-fullscreen").addEventListener("click", () => {
    if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(() => toast("Fullscreen error"));
    else document.exitFullscreen();
  });

  // --- API FETCHING ---
  async function fetchAirQuality(lat, lon) {
    try {
      const aqRes = await fetch(`https://air-quality-api.open-meteo.com/v1/air-quality?latitude=${lat}&longitude=${lon}&current=us_aqi,pm10,pm2_5,ozone`);
      const aqData = await aqRes.json();
      
      const wRes = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=wind_speed_10m,wind_direction_10m`);
      const wData = await wRes.json();

      const aqi = aqData.current.us_aqi || 0;
      const pm25 = aqData.current.pm2_5 || 0;
      const ozone = aqData.current.ozone || 0;
      const windSpeed = wData.current.wind_speed_10m;
      const windDir = wData.current.wind_direction_10m;

      $("#aqiValue").textContent = aqi;
      $("#aqiPm25").textContent = pm25 + " µg/m³";
      $("#aqiOzone").textContent = ozone + " µg/m³";
      $("#windSpeed").textContent = windSpeed;
      $("#windNeedle").style.transform = `rotate(${windDir}deg)`;

      $("#hudWind").textContent = windSpeed;
      $("#hudAqi").textContent = aqi;
      $("#hudLat").textContent = lat.toFixed(4);
      $("#hudLon").textContent = lon.toFixed(4);

      let color = "var(--primary)", status = "Good";
      if (aqi > 50) { color = "#f6d365"; status = "Moderate"; }
      if (aqi > 100) { color = "#ff8c00"; status = "Unhealthy (Sensitive)"; }
      if (aqi > 150) { color = "var(--danger)"; status = "Unhealthy"; }
      
      $("#aqiValue").style.background = color;
      $("#aqiValue").style.webkitBackgroundClip = "text";
      $("#aqiStatus").textContent = status;
      $("#aqiStatus").style.color = color;

    } catch (e) {
      $("#aqiStatus").textContent = "Data unavailable";
    }
  }

  const facilityNames = ["Apex Chemical", "Riverside Refinery", "Valley Plating Co.", "Nova Plastics", "Delta Waste Mgmt", "Summit Manufacturing", "Metro Power Plant", "Titan Solvents"];
  const chemicals = ["Benzene", "Lead", "Mercury", "PM2.5", "Formaldehyde", "Sulfur Dioxide", "Chromium", "Toluene"];
  
  function generateMockFacilities(lat, lon) {
    const facs = [];
    const num = Math.floor(Math.random() * 3) + 2;
    for(let i=0; i<num; i++) {
      const offLat = (Math.random() - 0.5) * 0.02;
      const offLon = (Math.random() - 0.5) * 0.02;
      const riskScore = Math.floor(Math.random() * 100);
      facs.push({
        id: uid(), name: facilityNames[Math.floor(Math.random() * facilityNames.length)],
        type: ["Chemical Plant", "Refinery", "Waste Facility", "Factory"][Math.floor(Math.random()*4)],
        lat: lat + offLat, lon: lon + offLon, risk: riskScore,
        chemicals: [chemicals[Math.floor(Math.random()*chemicals.length)], chemicals[Math.floor(Math.random()*chemicals.length)]].filter((v,i,a)=>a.indexOf(v)===i),
        violations: Math.floor(Math.random() * 5)
      });
    }
    return facs.sort((a,b) => b.risk - a.risk);
  }

  // --- SEARCH LOGIC ---
  $("#btnScan").addEventListener("click", async (e) => {
    e.preventDefault();
    const q = $("#addressInput").value.trim();
    if(!q) return;
    
    $("#searchResults").innerHTML = "<div style='color:var(--primary); font-family:var(--mono); text-align:center; grid-column: 1/-1;'>Scanning for regions...</div>";
    
    try {
      const query = encodeURIComponent(`city in ${q}`);
      const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&limit=15&q=${query}`);
      const data = await res.json();
      
      if(data.length === 0) {
        const fallback = await fetch(`https://nominatim.openstreetmap.org/search?format=json&limit=10&q=${encodeURIComponent(q)}`);
        const fbData = await fallback.json();
        
        if(fbData.length === 0) {
          $("#searchResults").innerHTML = "<div style='color:var(--danger); font-family:var(--mono); text-align:center; grid-column: 1/-1;'>No results found.</div>";
          return;
        }
        renderSearchResults(fbData);
      } else {
        renderSearchResults(data);
      }
    } catch (err) {
      $("#searchResults").innerHTML = "<div style='color:var(--danger); text-align:center; grid-column: 1/-1;'>Network error.</div>";
    }
  });

  function renderSearchResults(data) {
    $("#searchResults").innerHTML = data.map(d => {
      const parts = d.display_name.split(',');
      const title = parts[0];
      const subtitle = parts.slice(1).join(',').trim();
      return `
      <div class="result-item" data-lat="${d.lat}" data-lon="${d.lon}" data-name="${esc(d.display_name)}">
        <strong>${esc(title)}</strong>
        <span>${esc(subtitle)}</span>
      </div>
    `}).join("");

    document.querySelectorAll(".result-item").forEach(el => {
      el.addEventListener("click", () => {
        addWatch(parseFloat(el.dataset.lat), parseFloat(el.dataset.lon), el.dataset.name);
        $("#searchResults").innerHTML = "";
        $("#addressInput").value = "";
      });
    });
  }

  $("#btnMyLocation").addEventListener("click", () => {
    if (!navigator.geolocation) { toast("Geolocation is not supported."); return; }
    $("#searchResults").innerHTML = "<div style='color:var(--primary); font-family:var(--mono); text-align:center; grid-column: 1/-1;'>📍 Acquiring GPS Signal...</div>";
    
    navigator.geolocation.getCurrentPosition(async (position) => {
      const lat = position.coords.latitude;
      const lon = position.coords.longitude;
      
      try {
        const geoRes = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}`);
        const geoData = await geoRes.json();
        const addressName = geoData.display_name || "My Current Location";

        $("#searchResults").innerHTML = `
          <div class="result-item" style="border-color:var(--primary); box-shadow:0 0 15px rgba(0,242,254,0.2); grid-column: 1/-1; flex-direction:row; justify-content:space-between; align-items:center;">
            <div>
              <strong style="color:var(--primary)">📍 Your Current Location</strong>
              <div style="color:var(--muted); font-size:0.8rem; margin-top:4px; line-height:1.4;">${esc(addressName)}</div>
              <div style="font-family:var(--mono); font-size:0.75rem; color:var(--text); margin-top:8px;">Lat: ${lat.toFixed(4)} | Lon: ${lon.toFixed(4)}</div>
            </div>
            <button class="btn-scan" style="padding:10px 20px;" id="btnAddCurrent">Watch This</button>
          </div>
        `;

        document.getElementById("btnAddCurrent").addEventListener("click", () => {
          addWatch(lat, lon, addressName);
          $("#searchResults").innerHTML = "";
        });

      } catch (err) {
        $("#searchResults").innerHTML = `<div style="color:var(--danger); text-align:center; grid-column: 1/-1;">Error fetching address.</div>`;
      }
    }, () => {
      toast("Location access denied.");
      $("#searchResults").innerHTML = "";
    });
  });

  function addWatch(lat, lon, name) {
    if(state.watches.find(w => w.name === name)) { toast("Already watching."); return; }
    state.watches.unshift({
      id: uid(), name: name, lat: lat, lon: lon,
      facilities: generateMockFacilities(lat, lon),
      addedAt: new Date().toISOString()
    });
    addHistory(`Added: ${name.split(',')[0]}`);
    toast("Region added to watchlist.");
  }

  function removeWatch(id, name) {
    if(!confirm("Stop monitoring this location?")) return;
    state.watches = state.watches.filter(w => w.id !== id);
    addHistory(`Removed: ${name.split(',')[0]}`);
    toast("Location removed.");
  }

  // --- RENDERERS ---
  function renderAll() {
    renderDashboard();
    renderLocations();
    renderHistory();
    if ($("#page-radar").classList.contains("active")) renderRadar();
  }

  function renderDashboard() {
    if (state.watches.length > 0) {
      fetchAirQuality(state.watches[0].lat, state.watches[0].lon);
    } else {
      fetchAirQuality(40.7128, -74.0060); 
    }

    const threats = $("#dashboardThreats");
    let allFacs = [];
    state.watches.forEach(w => allFacs.push(...w.facilities));
    allFacs.sort((a, b) => b.risk - a.risk);
    
    if (allFacs.length === 0) {
      threats.innerHTML = `<p style="color:var(--muted); font-size:0.9rem;">No threats found.</p>`;
    } else {
      threats.innerHTML = allFacs.slice(0, 4).map(f => `
        <div class="threat-item ${f.risk > 75 ? 'urgent' : ''}">
          <div>
            <div class="threat-name">${esc(f.name)}</div>
            <div class="threat-meta">${esc(f.chemicals.join(' · '))}</div>
          </div>
          <div class="risk-badge ${f.risk > 75 ? 'risk-high' : 'risk-med'}">${f.risk}</div>
        </div>
      `).join('');
    }
  }

  function renderLocations() {
    const grid = $("#watchesGrid");
    if(state.watches.length === 0) {
      grid.innerHTML = `<div style="text-align:center; padding: 40px; color:var(--muted); grid-column: 1/-1;">No locations yet.</div>`;
      return;
    }

    grid.innerHTML = state.watches.map(w => `
      <div class="glass-panel watch-card">
        <button class="btn-remove" data-id="${w.id}" data-name="${esc(w.name)}">REMOVE</button>
        <h3 style="font-size: 1.1rem; margin-bottom: 4px; padding-right: 60px;">${esc(w.name.split(',')[0])}</h3>
        <p style="color: var(--muted); font-size: 0.8rem;">${w.lat.toFixed(4)}, ${w.lon.toFixed(4)}</p>
        <div class="map-frame">
          <iframe src="https://www.openstreetmap.org/export/embed.html?bbox=${w.lon-0.02},${w.lat-0.02},${w.lon+0.02},${w.lat+0.02}&layer=mapnik&marker=${w.lat},${w.lon}" loading="lazy"></iframe>
        </div>
        <div style="display:flex; flex-direction:column; gap:8px;">
          ${w.facilities.slice(0,3).map(f => `
            <div style="display:flex; justify-content:space-between; font-size:0.85rem;">
              <span>${esc(f.name)}</span>
              <span class="${f.risk > 75 ? 'risk-high' : 'risk-med'}" style="padding:2px 6px; border-radius:4px; font-weight:bold; font-family:var(--mono);">${f.risk}</span>
            </div>
          `).join('')}
        </div>
      </div>
    `).join('');

    document.querySelectorAll(".btn-remove").forEach(btn => {
      btn.addEventListener("click", () => removeWatch(btn.dataset.id, btn.dataset.name));
    });
  }

  function renderRadar() {
    const container = $("#radarContainer");
    document.querySelectorAll(".radar-node", container).forEach(n => n.remove());
    if(state.watches.length === 0) { $("#hudTargets").textContent = "0"; return; }

    const centerLat = state.watches[0].lat;
    const centerLon = state.watches[0].lon;
    let totalTargets = 0;

    state.watches.forEach(w => {
      w.facilities.forEach(f => {
        const dx = f.lon - centerLon;
        const dy = f.lat - centerLat;
        let x = dx * 5000, y = -dy * 5000;
        x = Math.max(-250, Math.min(250, x)); y = Math.max(-250, Math.min(250, y));

        const node = document.createElement("div");
        node.className = "radar-node";
        node.style.left = `calc(50% + ${x}px)`;
        node.style.top = `calc(50% + ${y}px)`;
        node.innerHTML = `<div class="label">${f.name}<br>RISK: ${f.risk}</div>`;
        container.appendChild(node);
        totalTargets++;
      });
    });
    $("#hudTargets").textContent = totalTargets;
  }

  function renderHistory() {
    const list = $("#historyList");
    if(state.history.length === 0) {
      list.innerHTML = `<div style="text-align:center; padding: 40px; color:var(--muted);">No history logs.</div>`;
      return;
    }
    list.innerHTML = state.history.map(h => `
      <div class="history-item">
        <div style="font-weight:600;">${esc(h.action)}</div>
        <div class="history-time">${fmtDate(h.time)}</div>
      </div>
    `).join('');
  }

  loadData();
  renderAll();

})();
</script>
</body>
</html>
